name: assetmanager

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  market-data:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-market-data.txt
    command: ["uvicorn", "services.market_data_gateway.main:app", "--host", "0.0.0.0", "--port", "8291"]
    ports:
      - "8291:8291"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MARKET_DATA_DB_PATH: /app/data/market_data.duckdb
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - market_data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8291/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6

  analysis:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-analysis.txt
    command: ["uvicorn", "services.strategy_engine.main:app", "--host", "0.0.0.0", "--port", "8292"]
    ports:
      - "8292:8292"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      kafka:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8292/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6

  api:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-container.txt
    command: ["uvicorn", "app.main:sio_app", "--host", "0.0.0.0", "--port", "8282"]
    ports:
      - "8282:8282"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EXECUTION_GATEWAY_URL: http://host.docker.internal:8293
      API_ENABLE_KAFKA_FANOUT: "true"
      API_ENABLE_SCHEDULER: "false"
      API_ENABLE_BROKER_CONNECTIONS: "false"
    env_file:
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_data:/app/data
      - reports:/app/reports
    depends_on:
      kafka:
        condition: service_healthy
      market-data:
        condition: service_healthy
      analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8282/health/live"]
      interval: 10s
      timeout: 3s
      retries: 8

volumes:
  kafka_data:
  market_data:
  api_data:
  reports:
